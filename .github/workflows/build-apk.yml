name: Build Jarves APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Jarves.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarves-apk
          path: Jarves.apk

      - name: Publish APK as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarves-latest
          name: Jarves — latest APK
          files: Jarves.apk
          body: |
            Phone par **Jarves.apk** download karke install karein.
            Install ke baad app kholkar **⚙ Setup** mein API key aur permissions set karein.
            Built from commit ${{ github.sha }} (branch ${{ github.ref_name }}).
